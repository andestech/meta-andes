header:
  version: 14
  includes:
    - base-riscv.yml

machine: qilai

local_conf_header:
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_rpm"
    SDKMACHINE = "x86_64"
    # Use 'haveged' instead 'rng-tools' due to 'SIGSEGV' error during start 'rngd'
    PACKAGE_EXCLUDE:append = " rng-tools"
    IMAGE_INSTALL:append = " haveged"
    # AMD GPU firmware blobs
    IMAGE_INSTALL:append = " linux-firmware"
    IMAGE_FEATURES += " \
        ssh-server-openssh \
        debug-tweaks \
    "
