header:
  version: 14

local_conf_header:
  default: |
    # -- Default local.conf from meta-poky/conf/local.conf.sample -- #
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks"
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
    PACKAGECONFIG:append:pn-qemu-system-native = " sdl"
    PACKAGE_CLASSES = "package_rpm"
    SDKMACHINE = "x86_64"
    CONF_VERSION = "2"
  ast540: |
    PREFERRED_VERSION_linux-libc-headers = "6.6"
  bbmask: |
    # Mask meta-riscv recipes that use the git:// protocol to fetch from
    # git.kernel.org. The git:// protocol (port 9418) is blocked by most
    # corporate proxies and has been deprecated by kernel.org.
    # These recipes are not needed for Andes ae350-* machines.
    BBMASK += "meta-riscv/recipes-kernel/linux/linux-milkv-duo\.bb"
    BBMASK += "meta-riscv/recipes-kernel/linux/linux-mainline_6\.2\.bb"

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
